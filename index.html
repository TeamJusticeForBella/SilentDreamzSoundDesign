<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="C.D.C.S. is a browser-native cadence studio for planning song sections and validating lyric density." />
  <title>C.D.C.S. | Custom Designed Cadence Studio</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <noscript>C.D.C.S. requires JavaScript to run.</noscript>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">C</div>
        <div>
          <p class="eyebrow">Constraint-driven songwriting</p>
          <h1>C.D.C.S.</h1>
        </div>
      </div>

      <div class="transport" aria-label="Audio transport">
        <label class="file-button" for="audio-file">Load audio</label>
        <input id="audio-file" type="file" accept="audio/*" hidden />
        <button id="play-button" type="button" class="icon-button" aria-label="Play or pause" disabled>▶</button>
        <button id="stop-button" type="button" class="icon-button" aria-label="Stop" disabled>■</button>
        <span id="transport-time" class="transport-time">0:00 / 0:00</span>
      </div>
    </header>

    <main class="workspace">
      <section class="studio" aria-labelledby="project-heading">
        <div class="project-toolbar">
          <div>
            <p class="eyebrow">Active project</p>
            <h2 id="project-heading">Percs on My Line</h2>
          </div>
          <div class="metrics" aria-label="Project metrics">
            <label>BPM <input id="bpm-input" type="number" min="40" max="260" step="0.1" /></label>
            <label>Key <input id="key-input" type="text" maxlength="32" /></label>
            <div><span>Bars</span><strong id="total-bars">0</strong></div>
            <div><span>Length</span><strong id="project-duration">0:00</strong></div>
          </div>
        </div>

        <div class="timeline-ruler" aria-hidden="true">
          <span>0:00</span>
          <div class="ruler-line"></div>
          <span id="ruler-end">0:00</span>
        </div>

        <div class="timeline-shell">
          <div id="playhead" class="playhead" aria-hidden="true"></div>
          <div id="timeline" class="timeline" role="list" aria-label="Song sections"></div>
        </div>

        <div class="seek-row">
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Audio position" disabled />
        </div>

        <section class="validation-panel" aria-labelledby="validation-heading">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Deterministic checks</p>
              <h3 id="validation-heading">Cadence Coach</h3>
            </div>
            <div id="validation-summary" class="summary-pills"></div>
          </div>
          <div id="validation-log" class="validation-log"></div>
        </section>
      </section>

      <aside class="inspector" aria-labelledby="inspector-heading">
        <div class="inspector-header">
          <div>
            <p class="eyebrow">Section inspector</p>
            <h2 id="inspector-heading">Select a section</h2>
          </div>
          <span id="section-status" class="status-badge neutral">idle</span>
        </div>

        <div class="form-grid">
          <label>Section name <input id="section-name" type="text" maxlength="80" /></label>
          <label>Bars <input id="section-bars" type="number" min="1" max="128" step="1" /></label>
          <label>Cadence <select id="section-cadence"></select></label>
          <label>Density scale
            <div class="range-with-output">
              <input id="density-scale" type="range" min="0.25" max="2" step="0.05" />
              <output id="density-output">1.00×</output>
            </div>
          </label>
          <label class="full-span">Lyrics
            <textarea id="section-lyrics" rows="15" spellcheck="true" placeholder="Write or paste lyrics for this section..."></textarea>
          </label>
        </div>

        <div class="section-readout">
          <div><span>Estimated</span><strong id="estimated-syllables">0 syllables</strong></div>
          <div><span>Target</span><strong id="target-budget">0–0 syllables</strong></div>
          <div><span>Time</span><strong id="section-time">0:00–0:00</strong></div>
        </div>

        <div class="action-row">
          <button id="export-button" type="button" class="primary-button">Export project</button>
          <label class="secondary-button" for="import-file">Import JSON</label>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
          <button id="reset-button" type="button" class="danger-button">Reset</button>
        </div>
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
      </aside>
    </main>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
